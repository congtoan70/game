<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phá gạch — 6 level</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>Phá gạch</h1>
    <div class="toolbar">
      <label for="level-select">Chọn level:</label>
      <select id="level-select" aria-label="Chọn level"></select>
      <button id="restart-button" type="button">Chơi lại</button>
    </div>

    <p class="instructions">Di chuyển chuột, chạm/kéo trên sân, hoặc dùng phím ← →. Nhấn Space để thả bóng.</p>

    <div id="game-shell">
      <div id="game" aria-label="Sân chơi phá gạch">
        <div id="hud">
          <span id="lives">Mạng: 3</span>
          <span id="score">Điểm: 0</span>
          <span id="ball-count">Bóng: 1</span>
          <span id="level-info"></span>
        </div>
        <div id="bricks"></div>
        <div id="blocker"></div>
        <div id="items"></div>
        <div id="paddle"></div>
        <div id="balls"></div>
        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </div>

    
  </main>
</body>
</html>
